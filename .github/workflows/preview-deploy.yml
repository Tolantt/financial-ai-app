name: Preview Deployment

on:
  push:
    branches:
      - preview/**
      - feature/**
      - staging

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Install Surge CLI
        run: npm install --global surge

      - name: Prepare preview metadata
        id: preview
        run: |
          BRANCH_SLUG=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g')
          BRANCH_SLUG=$(echo "$BRANCH_SLUG" | sed 's/^-*//' | sed 's/-*$//')
          if [ -z "$BRANCH_SLUG" ]; then
            BRANCH_SLUG="preview"
          fi
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-8)
          DOMAIN="${BRANCH_SLUG}-${SHORT_SHA}-${GITHUB_RUN_NUMBER}.surge.sh"
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"
          echo "preview_url=https://$DOMAIN" >> "$GITHUB_OUTPUT"

      - name: Deploy to Surge
        id: deploy
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
          DEPLOY_DOMAIN: ${{ steps.preview.outputs.domain }}
        run: |
          if [ -z "$SURGE_LOGIN" ] || [ -z "$SURGE_TOKEN" ]; then
            echo "SURGE_LOGIN and SURGE_TOKEN secrets are required for preview deployments." >&2
            exit 1
          fi
          mkdir -p ~/.surge
          printf "%s\n" "$SURGE_LOGIN" > ~/.surge/login
          printf "%s\n" "$SURGE_TOKEN" > ~/.surge/token
          surge ./dist "$DEPLOY_DOMAIN" --token "$SURGE_TOKEN"

      - name: Publish deployment status
        if: ${{ success() }}
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        with:
          github-token: ${{ github.token }}
          script: |
            const url = process.env.PREVIEW_URL;
            const refName = context.ref.replace('refs/heads/', '');
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: `preview/${refName}`,
              auto_merge: false,
              transient_environment: true,
              required_contexts: []
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment_url: url,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Output preview URL
        run: echo "Preview available at ${{ steps.preview.outputs.preview_url }}"
